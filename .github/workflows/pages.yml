name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# allow the workflow to publish Pages, one deployment at a time
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # a project site is served from /<repo>/, so the app has to know its base
      - name: Build
        run: npx ng build --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Prepare for Pages
        run: |
          DIST=dist/tirta-estate/browser
          # GitHub Pages has no SPA fallback: serve index.html for unknown paths
          cp "$DIST/index.html" "$DIST/404.html"
          # stop Jekyll from filtering files
          touch "$DIST/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tirta-estate/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
