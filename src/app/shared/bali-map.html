<div class="map-plot">
    <svg
      class="map-svg"
      [attr.viewBox]="'0 0 ' + map.width + ' ' + map.height"
      role="img"
      [attr.aria-label]="'map.aria' | t"
      (mouseleave)="hovered.set(null)"
    >
      @for (d of map.paths; track $index) {
        <path class="island" [attr.d]="d" />
      }

      @for (l of landmarks; track l.label) {
        <g class="landmark">
          <circle [attr.cx]="l.x" [attr.cy]="l.y" r="3.5" />
          <text [attr.x]="l.x + 9" [attr.y]="l.y + 5">{{ l.label | t }}</text>
        </g>
      }

      @for (m of markers(); track m.id) {
        <g
          class="marker"
          [class.is-empty]="m.count === 0"
          [class.is-active]="active() === m.id"
          [class.is-selected]="selected() === m.id"
          (mouseenter)="hovered.set(m.id)"
          (focusin)="hovered.set(m.id)"
          (click)="toggle(m.id)"
          (keydown.enter)="toggle(m.id)"
          (keydown.space)="toggle(m.id)"
          tabindex="0"
          role="button"
          [attr.aria-pressed]="selected() === m.id"
          [attr.aria-label]="'map.markerAria' | t: { name: m.name, count: m.count }"
        >
          <circle class="halo" [attr.cx]="m.x" [attr.cy]="m.y" [attr.r]="m.radius + 9" />
          <circle class="disc" [attr.cx]="m.x" [attr.cy]="m.y" [attr.r]="m.radius" />
          @if (m.count > 0) {
            <text class="count" [attr.x]="m.x" [attr.y]="m.y + 6">{{ m.count }}</text>
          }
          <text class="pin-label" [attr.x]="m.x" [attr.y]="m.y - m.radius - 10">{{ m.name }}</text>
        </g>
      }
    </svg>
  </div>
